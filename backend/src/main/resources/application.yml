spring:
  application:
    name: pulso-piura-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pulso_piura}
    username: ${POSTGRES_USER:pulso_app}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: app
  flyway:
    schemas: app
    default-schema: app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/pulso-piura}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/pulso-piura/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:pulso-api}
app:
  security:
    provider: ${AUTH_PROVIDER:keycloak}
    claims-namespace: ${OIDC_CLAIMS_NAMESPACE:https://pulsopiura.app}
    roles-claim: ${OIDC_ROLES_CLAIM:https://pulsopiura.app/roles}
    platform-admin-email: ${PLATFORM_ADMIN_EMAIL:}
    write-limit-per-minute: ${API_WRITE_LIMIT_PER_MINUTE:60}
  web:
    allowed-origin: ${WEB_ALLOWED_ORIGIN:http://localhost:3000}
  reservations:
    hold-duration: ${RESERVATION_HOLD_DURATION:PT5M}
    max-active-temporary-per-customer: ${RESERVATION_MAX_ACTIVE_TEMPORARY_PER_CUSTOMER:3}
  payments:
    mode: ${PAYMENTS_MODE:disabled}
    proof-storage: ${PAYMENT_PROOF_STORAGE:filesystem}
    supabase:
      url: ${SUPABASE_STORAGE_URL:}
      secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:payment-proofs}
    proof-directory: ${PAYMENT_PROOF_DIRECTORY:.local/payment-proofs}
    review-minutes: ${EXTERNAL_PAYMENT_REVIEW_MINUTES:30}
    proof-retention-days: ${PAYMENT_PROOF_RETENTION_DAYS:90}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
