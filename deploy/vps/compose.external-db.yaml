# VPS API + HTTPS with external PostgreSQL (Supabase or another provider).
# docker compose --env-file ../supabase/.env.production -f compose.external-db.yaml up -d --build
services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: ${DATABASE_URL:?Set the external JDBC URL}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL}}
      MIGRATION_POSTGRES_USER: ${MIGRATION_POSTGRES_USER:-${POSTGRES_USER}}
      MIGRATION_POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-3}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-0}
      AUTH_PROVIDER: auth0
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-https://pulsopiura.app/roles}
      OIDC_CLAIMS_NAMESPACE: ${OIDC_CLAIMS_NAMESPACE:-https://pulsopiura.app}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:?}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      PAYMENT_PROOF_DIRECTORY: /srv/pulso/private/payment-proofs
      PAYMENT_PROOF_RETENTION_DAYS: ${PAYMENT_PROOF_RETENTION_DAYS:-90}
      EXTERNAL_PAYMENT_REVIEW_MINUTES: ${EXTERNAL_PAYMENT_REVIEW_MINUTES:-30}
    volumes:
      - payment_proofs:/srv/pulso/private/payment-proofs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    networks: [private, edge]
  caddy:
    extends:
      file: compose.auth0.yaml
      service: caddy
networks:
  private:
    internal: true
  edge:
volumes:
  payment_proofs:
  caddy_data:
  caddy_config:
